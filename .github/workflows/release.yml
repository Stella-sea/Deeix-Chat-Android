name: Publish multi-platform release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; fi
          VERSION="$(python3 -c 'import json; print(json.load(open("release-config.json"))["version"])')"
          test "$TAG" = "v$VERSION"
          test "$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)" = "$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-${{ env.ANDROID_API }} build-tools;${{ env.BUILD_TOOLS }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing identity
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_BASE64="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n[:space:]')"
          STORE_PASSWORD="$(printf '%s' "$RELEASE_STORE_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$RELEASE_KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$RELEASE_KEY_PASSWORD" | tr -d '\r\n')"
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing.p12
          printf '%s' "$STORE_PASSWORD" > signing-passphrase.txt
          printf '%s' "$KEY_PASSWORD" > signing-key-passphrase.txt
          printf '%s' "$KEY_ALIAS" > signing-alias.txt
          chmod 600 signing.p12 signing-passphrase.txt signing-key-passphrase.txt signing-alias.txt
      - name: Build, align, and sign APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks signing.p12 --ks-type PKCS12 --ks-key-alias "$(cat signing-alias.txt)" \
            --ks-pass file:signing-passphrase.txt --key-pass file:signing-key-passphrase.txt \
            --out "Deeix-Chat-${VERSION}.apk" app-release-aligned.apk
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "Deeix-Chat-${VERSION}.apk"
          sha256sum "Deeix-Chat-${VERSION}.apk" > "Deeix-Chat-${VERSION}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            Deeix-Chat-${{ steps.version.outputs.version }}.apk
            Deeix-Chat-${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS IPA
    runs-on: macos-14
    needs: android
    steps:
      - uses: actions/checkout@v4
      - name: Detect iOS project
        id: project
        run: |
          if [[ -f platforms/ios/DeeixChat.xcodeproj/project.pbxproj ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build IPA
        if: steps.project.outputs.enabled == 'true'
        run: |
          test -n "${{ secrets.IOS_CERTIFICATE_BASE64 }}"
          test -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}"
          xcodebuild -project platforms/ios/DeeixChat.xcodeproj -scheme DeeixChat -configuration Release -archivePath build/DeeixChat.xcarchive archive
          xcodebuild -exportArchive -archivePath build/DeeixChat.xcarchive -exportOptionsPlist platforms/ios/ExportOptions.plist -exportPath build/export
      - name: Record pending iOS target
        if: steps.project.outputs.enabled != 'true'
        run: echo "iOS project is not present yet; Android release continues."
      - uses: actions/upload-artifact@v4
        if: steps.project.outputs.enabled == 'true'
        with:
          name: ios-release
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 30

  harmony:
    name: HarmonyOS HAP
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - name: Detect HarmonyOS project
        id: project
        run: |
          if [[ -f platforms/harmony/DeeixChat/oh-package.json5 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build HAP
        if: steps.project.outputs.enabled == 'true'
        run: |
          test -x platforms/harmony/DeeixChat/hvigorw
          platforms/harmony/DeeixChat/hvigorw assembleHap --mode module -p product=default
      - name: Record pending HarmonyOS target
        if: steps.project.outputs.enabled != 'true'
        run: echo "HarmonyOS project is not present yet; Android release continues."
      - uses: actions/upload-artifact@v4
        if: steps.project.outputs.enabled == 'true'
        with:
          name: harmony-release
          path: platforms/harmony/DeeixChat/entry/build/default/outputs/default/entry-default-unsigned.hap
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [android, ios, harmony]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release-assets
      - name: Create release manifest
        env:
          TAG: ${{ needs.android.outputs.tag }}
          VERSION: ${{ needs.android.outputs.version }}
          IOS_RESULT: ${{ needs.ios.result }}
          HARMONY_RESULT: ${{ needs.harmony.result }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('release-config.json', encoding='utf-8') as f:
              cfg = json.load(f)
          cfg['releaseTag'] = os.environ['TAG']
          cfg['version'] = os.environ['VERSION']
          cfg['ci'] = {
              'android': 'published',
              'ios': os.environ['IOS_RESULT'],
              'harmony': os.environ['HARMONY_RESULT']
          }
          with open('release-assets/release-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Deeix-Chat $VERSION" --notes-file RELEASE_NOTES.md
